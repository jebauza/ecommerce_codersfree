services:

  db:
    image: mariadb:10.6.23-jammy
    container_name: '${COMPOSE_PROJECT_NAME}-mariadb'
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: '${DB_PASSWORD:-root}'
      MARIADB_USER: '${DB_USERNAME:-user_db}'
      MARIADB_PASSWORD: '${DB_PASSWORD:-password_db}'
      MARIADB_DATABASE: '${DB_DATABASE:-db}'
    ports:
      - 3306:3306
    volumes:
      - ./mariadb:/var/lib/mysql

  ecommerce_codersfree_laravel_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce_codersfree_laravel_app
    container_name: '${COMPOSE_PROJECT_NAME}-laravel-app'
    restart: always
    volumes:
      - ./:/var/www/html
    environment:
      APP_KEY: base64:wsE5ehkkXaXEbUjVEUAKR1sTh88nq3doTmh9xWgrrzY=
      DB_HOST: db
      DB_CONNECTION_BE: mysql
      DB_PORT: 3306
      DB_DATABASE: '${DB_DATABASE:-db}'
      DB_USERNAME: '${DB_USERNAME:-user_db}'
      DB_PASSWORD: '${DB_PASSWORD:-password_db}'
    command: sh -c "npm run dev"
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: '${COMPOSE_PROJECT_NAME}-nginx'
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - db
      - ecommerce_codersfree_laravel_app

